format_version = 5
id = "ape.enhancement.two-spikes-prototype"
version = "0.1.0"
name = "Ape Escape Two Spike Prototype"
author = "nvd123"
description = "Experimental two-Spike co-op prototype with independent Player 2 controls, optional keyboard layouts for both players, separate movement/animation/gadget state, and routed collision ownership."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94423"
disc_sha256 = "1ae17e78ebb8c782c7c1785b0a0bd7b0ee28235b8a0c83c8df887129899a852a"

[[feature]]
id = "two-spike-preview"
name = "Two Spike Preview"
description = "Spawn a second independently controlled Spike. Optional separate keyboard layouts let both players share one keyboard; controller 2 and separate animation/gadget state are also supported."
group = "Experimental Gameplay"
default_enabled = false

[[plugin]]
feature = "two-spike-preview"
id = "ape.coop.two-spikes"

[[plugin]]
feature = "two-spike-preview"
id = "ape.coop.two-spikes-collision-owner"

[[option]]
feature = "two-spike-preview"
id = "p1-keyboard"
label = "Player 1 keyboard controls"
type = "boolean"
default = "true"

[[option]]
feature = "two-spike-preview"
id = "p2-keyboard"
label = "Player 2 keyboard controls"
type = "boolean"
default = "true"
