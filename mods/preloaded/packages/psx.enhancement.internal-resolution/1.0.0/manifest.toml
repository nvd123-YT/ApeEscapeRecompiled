# Title-owned override of the framework Internal Resolution package.
# Keep the generic controls, but follow this game's 4K game.toml baseline by default.
format_version = 11
id = "psx.enhancement.internal-resolution"
version = "1.0.0"
name = "Ape Escape Internal Resolution"
author = "Ape Escape Recompiled"
description = "Ape Escape host-side resolution controls. The default follows this title's 4K game.toml baseline; players can choose native through 8K, fixed scales, Auto, dynamic resolution and supersampling. Presentation only: each player keeps their own choice in netplay."
resolver = "declarative"
save_compatibility = "shared"

# Framework-owned host display control for every title, including legacy
# builtin allowlists. Saved choices override these fresh-profile defaults.
[[target]]
game_id = "SCUS-94423"

[[feature]]
id = "internal-resolution"
name = "Internal Resolution"
description = "Enabled by default. Game default follows Ape Escape's configured 4K baseline; players can choose native through 8K, fixed 1x–32x scales, Match display or Auto. The effective scale remains subject to GPU and memory limits."
group = "Visual"
default_enabled = true

[[option]]
feature = "internal-resolution"
id = "resolution"
label = "Internal resolution"
description = "Game default preserves Ape Escape's 4K baseline. Fixed scales through 32x, height presets, Match display and Auto remain available. Hardware and memory limits may reduce the effective scale."
group = "Visual"
type = "choice"
default = "default"

